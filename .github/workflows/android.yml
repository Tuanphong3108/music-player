name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build release APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle --no-daemon assembleRelease
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.${{ github.run_number }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk MediaPlayer.apk
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" MediaPlayer.apk --title "Media Player (Android) $TAG" --latest \
            --notes "APK Android (WebView) phiên bản $TAG (build #${{ github.run_number }}). App tự cập nhật nội dung theo repo, dùng được offline."
