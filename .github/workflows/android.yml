name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Release notes (leave empty to use android/RELEASE_NOTES.md or recent commits)"
        required: false
        type: string
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.6.0' }
      - name: Install Android SDK platform 37
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" --list 2>/dev/null | grep -E "platforms;android-3[67]" || true
          "$SDKM" "platforms;android-37.0" || "$SDKM" "platforms;android-37"
          ls "$ANDROID_HOME/platforms"
      - name: Compute version
        id: ver
        run: |
          RUN_NUM=${{ github.run_number }}
          MINOR=$((RUN_NUM / 100))
          PATCH=$((RUN_NUM % 100))
          VER="1.${MINOR}.${PATCH}"
          echo "code=${RUN_NUM}" >> "$GITHUB_OUTPUT"
          echo "name=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VER}" >> "$GITHUB_OUTPUT"
      - name: Build release APK
        working-directory: android
        env:
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: gradle --no-daemon assembleRelease
      - name: Prepare release notes
        env:
          RELEASE_NOTES_INPUT: ${{ github.event.inputs.release_notes }}
        run: |
          if [ -n "$RELEASE_NOTES_INPUT" ]; then
            printf '%s\\n' "$RELEASE_NOTES_INPUT" > release_notes.txt
          elif [ -f android/RELEASE_NOTES.md ]; then
            sed '/<!--/d' android/RELEASE_NOTES.md > release_notes.txt
            if [ ! -s release_notes.txt ]; then
              git log -20 --pretty=format:'- %s' -- android/ .github/workflows/android.yml > release_notes.txt
            fi
          else
            git log -20 --pretty=format:'- %s' -- android/ .github/workflows/android.yml > release_notes.txt
          fi
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk MediaPlayer.apk
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" MediaPlayer.apk --title "Media Player (Android) $TAG" --latest \
            --notes-file release_notes.txt
