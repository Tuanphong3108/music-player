<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What's New?</title>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@100..1000&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet">
  <style>
    :root { --bg:#0f111a; --text:#fff; --sub:rgba(255,255,255,.8); --card:rgba(255,255,255,.04); --border:rgba(255,255,255,.08); --accent:#c4b5fd; --accent2:#f0abfc; --badge:rgba(255,255,255,.1); }
    * { box-sizing: border-box; }
    html, body { margin:0; height:100%; }
    body { font-family:'Google Sans Flex',sans-serif; background:var(--bg); color:var(--sub); user-select:none; overflow:hidden; position:relative;
      transition: background-color .4s cubic-bezier(.4,0,.2,1), color .4s cubic-bezier(.4,0,.2,1); }
    body::before { content:""; position:fixed; inset:-20% -10% auto auto; width:360px; height:360px; pointer-events:none; z-index:0;
      background:radial-gradient(circle,color-mix(in srgb,var(--accent) 28%,transparent),transparent 65%); filter:blur(20px); }
    .ms { font-family:'Material Symbols Rounded'; font-weight:normal; font-style:normal; line-height:1; letter-spacing:normal; text-transform:none; white-space:nowrap; font-feature-settings:'liga'; font-variation-settings:'FILL' 1,'wght' 500; }
    .no-icons .ms { font-size:0 !important; }
    .no-icons .ms::before { content:"✦"; font-family:'Google Sans Flex',sans-serif; font-size:16px; }
    .no-icons .hero-icon .ms::before { font-size:26px; }
    .no-icons .chev::before { content:"›"; font-size:24px; }
    .no-icons .backbtn .ms::before { content:"‹"; font-size:26px; }

    /* 2 màn hình trượt ngang: danh sách phiên bản <-> chi tiết */
    .screen { position:absolute; inset:0; overflow-y:auto; padding:16px; z-index:1; transition:transform .38s cubic-bezier(.2,.8,.2,1), opacity .3s; }
    #screen-detail { transform:translateX(100%); opacity:0; pointer-events:none; }
    body.in-detail #screen-list { transform:translateX(-30%); opacity:0; pointer-events:none; }
    body.in-detail #screen-detail { transform:none; opacity:1; pointer-events:auto; }
    .wrap { max-width:1000px; margin:0 auto; display:flex; flex-direction:column; gap:16px; }
    .screen { padding:20px 24px; }

    .hero { display:flex; align-items:center; gap:14px; padding:18px; border-radius:22px; border:1px solid var(--border);
      background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 22%,transparent),color-mix(in srgb,var(--accent2) 14%,transparent)); animation:rise .5s cubic-bezier(.2,.8,.2,1) both; }
    .hero-icon { width:52px; height:52px; border-radius:16px; flex-shrink:0; display:grid; place-items:center; color:#fff; overflow:hidden;
      background:linear-gradient(135deg,var(--accent),var(--accent2)); box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 40%,transparent); }
    .hero-icon .ms { font-size:30px; }
    .hero-text { display:flex; flex-direction:column; gap:4px; min-width:0; }
    .kicker { font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
    h1 { margin:0; font-size:20px; font-weight:900; letter-spacing:-.01em; color:var(--text); display:flex; flex-wrap:wrap; align-items:baseline; gap:8px; }
    .ver { background:linear-gradient(90deg,var(--accent),var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent; font-weight:800; }
    .build { font:600 10px/1 ui-monospace,Menlo,Consolas,monospace; padding:4px 8px; border-radius:8px; background:var(--badge); color:var(--text); opacity:.85; }

    /* Bố cục PC: lưới nhiều cột cho thẻ phiên bản và mục cập nhật */
    .vgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:12px; }
    .vgrid > .state { grid-column:1/-1; }
    @media (min-width:900px) {
      .screen { padding:32px 48px; }
      .hero { padding:26px 28px; border-radius:26px; }
      .hero-icon { width:64px; height:64px; border-radius:20px; } .hero-icon .ms { font-size:36px; }
      h1 { font-size:26px; }
      .vcard { padding:18px 20px; } .vtitle { font-size:18px; }
      .item { padding:16px 18px; } .item .txt { font-size:14.5px; }
      .dhead { gap:16px; } .backbtn { width:48px; height:48px; }
    }
    /* Thẻ phiên bản */
    .vcard { display:flex; align-items:center; gap:14px; padding:14px 16px; border-radius:18px; cursor:pointer; text-align:left; width:100%;
      font-family:inherit; color:inherit; background:var(--card); border:1px solid var(--border);
      animation:rise .5s cubic-bezier(.2,.8,.2,1) both; transition:transform .2s, border-color .2s, background .3s; }
    .vcard:hover { transform:translateY(-2px); border-color:color-mix(in srgb,var(--accent) 55%,transparent); }
    .vcard:active { transform:scale(.985); }
    .vcard.latest { background:color-mix(in srgb,var(--accent) 10%,var(--card)); border-color:color-mix(in srgb,var(--accent) 40%,transparent); }
    .vcard .vi { width:42px; height:42px; border-radius:13px; flex-shrink:0; display:grid; place-items:center; overflow:hidden;
      background:color-mix(in srgb,var(--accent) 16%,transparent); color:var(--accent); }
    .vcard.latest .vi { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; }
    .vcard .vi .ms { font-size:22px; }
    .vmeta { flex:1; min-width:0; display:flex; flex-direction:column; gap:5px; }
    .vtitle { display:flex; align-items:center; flex-wrap:wrap; gap:8px; font-size:16px; font-weight:800; color:var(--text); }
    .vsub { font-size:12px; font-weight:600; opacity:.65; }
    .chev { font-size:22px; opacity:.5; }
    .tag { font-size:9.5px; font-weight:900; letter-spacing:.08em; padding:3px 8px; border-radius:999px; color:#fff; background:linear-gradient(90deg,var(--accent),var(--accent2)); }

    /* Chi tiết */
    .dhead { display:flex; align-items:center; gap:12px; animation:rise .4s both; }
    .backbtn { width:44px; height:44px; border-radius:50%; border:1px solid var(--border); background:var(--card); color:var(--text); cursor:pointer; display:grid; place-items:center; flex-shrink:0; transition:background .2s, transform .2s; }
    .backbtn:hover { background:color-mix(in srgb,var(--accent) 18%,var(--card)); transform:scale(1.06); }
    .backbtn .ms { font-size:24px; }
    .list { display:flex; flex-direction:column; gap:8px; }
    .item { display:flex; align-items:flex-start; gap:12px; padding:12px 14px; border-radius:16px; background:var(--card); border:1px solid var(--border);
      animation:rise .5s cubic-bezier(.2,.8,.2,1) both; transition:transform .2s, border-color .2s; }
    .item:hover { transform:translateY(-2px); border-color:color-mix(in srgb,var(--accent) 50%,transparent); }
    .item .ico { width:32px; height:32px; border-radius:10px; flex-shrink:0; display:grid; place-items:center; overflow:hidden; background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; }
    .item .ico .ms { font-size:19px; }
    .item .txt { flex:1; min-width:0; font-size:13.5px; font-weight:600; line-height:1.5; color:var(--sub); padding-top:5px; }
    .section { display:flex; align-items:center; gap:10px; font-size:12px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--text); opacity:.9; }
    .section::after { content:""; flex:1; height:1px; background:var(--border); }
    .section .dot { width:8px; height:8px; border-radius:50%; background:linear-gradient(135deg,var(--accent),var(--accent2)); }
    .state { text-align:center; padding:40px 12px; font-weight:600; opacity:.7; }
    .spinner { width:28px; height:28px; margin:0 auto 12px; border-radius:50%; border:3px solid var(--border); border-top-color:var(--accent); animation:spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @keyframes rise { from { opacity:0; transform:translateY(12px) scale(.98); } to { opacity:1; transform:none; } }
    @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
    ::-webkit-scrollbar { width:4px; } ::-webkit-scrollbar-thumb { background:rgba(155,155,155,.25); border-radius:99px; }
    @media (min-width:900px) { .list { display:grid; grid-template-columns:1fr 1fr; gap:12px; } }
  </style>
</head>
<body>
  <!-- MÀN HÌNH 1: DANH SÁCH PHIÊN BẢN -->
  <div class="screen" id="screen-list">
    <div class="wrap">
      <header class="hero">
        <div class="hero-icon"><span class="ms">history</span></div>
        <div class="hero-text"><span class="kicker" id="kicker">Changelog</span><h1><span id="appname"></span></h1></div>
      </header>
      <div class="section"><span class="dot"></span><span id="list-label">Phiên bản</span></div>
      <div id="versions" class="vgrid"></div>
    </div>
  </div>

  <!-- MÀN HÌNH 2: CHI TIẾT 1 PHIÊN BẢN -->
  <div class="screen" id="screen-detail">
    <div class="wrap">
      <div class="dhead">
        <button class="backbtn" id="back" aria-label="Back"><span class="ms">arrow_back</span></button>
        <h1 id="dtitle"></h1>
      </div>
      <div class="section"><span class="dot"></span><span id="detail-label">Có gì mới</span></div>
      <div class="list" id="ditems"></div>
    </div>
  </div>

  <script>
// =========================================================================
// ⬇️ CẤU HÌNH GIAO DIỆN ⬇️
// Nội dung từng phiên bản nằm ở /changelog-asset/<yyyy_mm_dd_hhmmss>.json
// và danh sách phiên bản nằm ở /changelog-asset/index.json
// (tên file 2026_10_11_075756.json  =  phiên bản 2026.10.11-build075756)
// =========================================================================
const EMBED_CONFIG = {
  appName: "Audio Player",
  assetDir: "changelog-asset/",
  defaultTheme: "dark",
  defaultLang: "vi",
  darkTheme:  { bg:"#0f111a", mainTextColor:"#ffffff", subTextColor:"rgba(255,255,255,0.8)", buildBadgeBg:"rgba(255,255,255,0.1)", cardBg:"rgba(255,255,255,0.04)", cardBorder:"rgba(255,255,255,0.08)", accent:"#c4b5fd", accent2:"#f0abfc" },
  lightTheme: { bg:"#f8f9fa", mainTextColor:"#1a1a1a", subTextColor:"rgba(0,0,0,0.7)",       buildBadgeBg:"rgba(0,0,0,0.06)",       cardBg:"rgba(0,0,0,0.035)",       cardBorder:"rgba(0,0,0,0.08)",       accent:"#7c3aed", accent2:"#c026d3" }
};
// =========================================================================

let currentTheme = EMBED_CONFIG.defaultTheme;
let currentLang  = EMBED_CONFIG.defaultLang || 'vi';
let versionIds = [];            // ["2026_10_11_075756", ...] (mới nhất trước)
const cache = {};               // id -> dữ liệu JSON
let openedId = null;

const T = {
  vi: { kicker:'Nhật ký cập nhật', list:'Các phiên bản', detail:'Có gì mới', latest:'MỚI NHẤT', updates:n=>n+' cập nhật', loading:'Đang tải…', error:'Không tải được changelog. Vui lòng thử lại sau.', retry:'Thử lại', empty:'Phiên bản này chưa có nội dung.' },
  en: { kicker:'Changelog', list:'Versions', detail:"What's new", latest:'LATEST', updates:n=>n+(n===1?' update':' updates'), loading:'Loading…', error:'Could not load the changelog. Please try again later.', retry:'Retry', empty:'This version has no notes.' }
};
const L = () => T[currentLang];

// 2026_10_11_075756 -> { version:'2026.10.11', build:'build075756' }
function parseId(id) {
  const m = /^(\d{4})_(\d{2})_(\d{2})_(\d{6})$/.exec(id);
  if (!m) return { version: id, build: '' };
  return { version: m[1] + '.' + m[2] + '.' + m[3], build: 'build' + m[4] };
}
function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T00:00:00'); if (isNaN(d)) return iso;
  return d.toLocaleDateString(currentLang === 'en' ? 'en-US' : 'vi-VN', { day:'numeric', month:'long', year:'numeric' });
}

const ICON_RULES = [
  [/tìm kiếm|search/i,'search'],[/sidebar|danh mục|category/i,'view_sidebar'],[/about/i,'info'],[/dropdown/i,'arrow_drop_down_circle'],
  [/toast|dialog|thông báo|pop-up/i,'notifications'],[/composer|lỗi|fixed|bug/i,'bug_report'],[/phản hồi|feedback/i,'feedback'],
  [/pip/i,'picture_in_picture_alt'],[/màu|accent|album/i,'palette'],[/âm thanh|audio|output|đầu ra/i,'headphones'],
  [/shuffle|previous/i,'shuffle'],[/ngôn ngữ|language|english|tiếng anh/i,'translate'],[/tốc độ|speed/i,'speed'],
  [/màn hình|screen|full/i,'fullscreen'],[/cài đặt|settings/i,'settings']
];
const pickIcon = t => { for (const [re,n] of ICON_RULES) if (re.test(t)) return n; return 'check_circle'; };
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const icon = name => el('span','ms',name);

async function fetchJson(path) {
  const r = await fetch(EMBED_CONFIG.assetDir + path, { cache:'no-cache' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
const itemsOf = d => (d && (d[currentLang] || d.vi || d.en)) || [];

function renderStatic() {
  document.documentElement.lang = currentLang;
  document.getElementById('kicker').textContent = L().kicker;
  document.getElementById('appname').textContent = EMBED_CONFIG.appName;
  document.getElementById('list-label').textContent = L().list;
  document.getElementById('detail-label').textContent = L().detail;
}

function showState(html) { const v = document.getElementById('versions'); v.innerHTML = ''; v.appendChild(html); }

async function loadList() {
  const spin = el('div','state'); spin.append(el('div','spinner'), el('div',null,L().loading)); showState(spin);
  try {
    const idx = await fetchJson('index.json');
    versionIds = (Array.isArray(idx) ? idx : idx.versions || []).map(String).sort().reverse(); // tên file tăng dần theo thời gian
    await Promise.all(versionIds.map(async id => { try { cache[id] = await fetchJson(id + '.json'); } catch (e) { cache[id] = null; } }));
    renderList();
  } catch (e) {
    const box = el('div','state', L().error);
    const b = el('button','tag',L().retry); b.style.cssText = 'margin-top:12px;border:none;cursor:pointer;font-size:12px;padding:8px 16px;font-family:inherit;'; b.onclick = loadList;
    box.appendChild(el('br')); box.appendChild(b); showState(box);
  }
}

function renderList() {
  const v = document.getElementById('versions'); v.innerHTML = '';
  versionIds.forEach((id, i) => {
    const { version, build } = parseId(id);
    const data = cache[id];
    const card = el('button','vcard' + (i === 0 ? ' latest' : ''));
    card.style.animationDelay = (0.05 + i * 0.05) + 's';
    const vi = el('div','vi'); vi.appendChild(icon(i === 0 ? 'auto_awesome' : 'new_releases'));
    const meta = el('div','vmeta');
    const title = el('div','vtitle');
    title.append(el('span',null,'v' + version), el('span','build',build));
    if (i === 0) title.appendChild(el('span','tag',L().latest));
    const sub = el('div','vsub', [fmtDate(data && data.date), data ? L().updates(itemsOf(data).length) : ''].filter(Boolean).join(' • '));
    meta.append(title, sub);
    const chev = icon('chevron_right'); chev.classList.add('chev');
    card.append(vi, meta, chev);
    card.onclick = () => openVersion(id);
    v.appendChild(card);
  });
  if (!versionIds.length) showState(el('div','state',L().empty));
  if (openedId) renderDetail(openedId);
}

function renderDetail(id) {
  const { version, build } = parseId(id);
  const h = document.getElementById('dtitle'); h.innerHTML = '';
  const sp = el('span','ver','v' + version); h.append(el('span',null,EMBED_CONFIG.appName), sp, el('span','build',build));
  const list = document.getElementById('ditems'); list.innerHTML = '';
  const items = itemsOf(cache[id]);
  if (!items.length) { list.appendChild(el('div','state',L().empty)); return; }
  items.forEach((text, i) => {
    const it = el('div','item'); it.style.animationDelay = (0.1 + i * 0.045) + 's';
    const ic = el('div','ico'); ic.appendChild(icon(pickIcon(text)));
    it.append(ic, el('div','txt',text)); list.appendChild(it);
  });
}

function openVersion(id) {
  openedId = id; renderDetail(id);
  document.body.classList.add('in-detail');
  document.getElementById('screen-detail').scrollTop = 0;
}
function closeVersion() { openedId = null; document.body.classList.remove('in-detail'); }
document.getElementById('back').addEventListener('click', closeVersion);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && openedId) closeVersion(); });

function applyThemeStyles(name) {
  currentTheme = name;
  const t = name === 'light' ? EMBED_CONFIG.lightTheme : EMBED_CONFIG.darkTheme, r = document.documentElement.style;
  r.setProperty('--bg',t.bg); r.setProperty('--text',t.mainTextColor); r.setProperty('--sub',t.subTextColor); r.setProperty('--card',t.cardBg);
  r.setProperty('--border',t.cardBorder); r.setProperty('--accent',t.accent); r.setProperty('--accent2',t.accent2); r.setProperty('--badge',t.buildBadgeBg);
}
function setLang(l) { currentLang = l === 'en' ? 'en' : 'vi'; renderStatic(); if (versionIds.length) renderList(); }

// postMessage từ trang cha: "dark"/"light" và "vi"/"en"
window.addEventListener('message', ev => {
  const d = ev.data; if (!d) return;
  if (d === 'dark' || d.theme === 'dark') applyThemeStyles('dark'); else if (d === 'light' || d.theme === 'light') applyThemeStyles('light');
  if (d === 'vi' || d.lang === 'vi' || d.language === 'vi') setLang('vi'); else if (d === 'en' || d.lang === 'en' || d.language === 'en') setLang('en');
});

applyThemeStyles(currentTheme); renderStatic(); loadList();

// Font icon không tải được -> dùng ký hiệu dự phòng
(function () {
  const fail = () => document.documentElement.classList.add('no-icons');
  try {
    document.fonts.load('24px "Material Symbols Rounded"','search').then(f => { if (!f.length) fail(); }).catch(fail);
    setTimeout(() => { if (!document.fonts.check('24px "Material Symbols Rounded"')) fail(); }, 3000);
  } catch (e) { fail(); }
})();
  </script>
</body>
</html>
